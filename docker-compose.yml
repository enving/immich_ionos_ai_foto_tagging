#
# Immich - M1 Mac Optimized Configuration
# Self-hosted photo and video management
# Optimized for Apple Silicon (M1/M2/M3) with unified memory
#

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${UPLOAD_LOCATION}/immich_system_data/thumbs:/data/thumbs
      - ${UPLOAD_LOCATION}/imported:/imported
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      # M1 16GB Optimizations - reduce concurrent ML jobs
      MACHINE_LEARNING_PARALLEL_JOBS: 1
      MACHINE_LEARNING_BATCH_SIZE: 1
      # Thumbnail generation settings
      THUMBNAIL_GENERATION_PARALLELISM: 2
    ports:
      - '0.0.0.0:2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  immich-machine-learning:
    container_name: immich_machine_learning
    # M1 native ARM64 - auto-optimized for Neural Engine
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      # M1 16GB Optimizations - limit concurrent jobs
      MACHINE_LEARNING_WORKERS: 1
      MACHINE_LEARNING_WORKER_TIMEOUT: 300
      # Improved memory usage and model caching
      MACHINE_LEARNING_MODEL_TTL: 600
      # Enhanced ML models and language support
      CLIP_MODEL_NAME: ViT-B-32
      ENABLE_OBJECT_DETECTION: "true"
      OBJECT_DETECTION_MODEL: yolov8x
      LANGUAGE: de
    restart: always
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 2G
    healthcheck:
      disable: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # M1 Optimization: Utilize unified memory efficiently
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: '0.9'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 256mb
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-cache:
    driver: local
